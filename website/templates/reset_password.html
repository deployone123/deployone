<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password — DeployOne</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <style>
        :root {
            --bg: #03050a;
            --bg-dark: #010204;
            --surface: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #5674ff;
            --accent-glow: rgba(86, 116, 255, 0.3);
            --accent-secondary: #a855f7;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --white: #ffffff;
            --sans: 'Outfit', sans-serif;
            --mono: 'Space Mono', monospace;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --bg-dark: #f1f5f9;
            --surface: rgba(255, 255, 255, 0.8);
            --border: rgba(0, 0, 0, 0.08);
            --text: #0f172a;
            --muted: #64748b;
            --white: #000000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transition: background 0.4s, color 0.4s;
        }
        
        .hero-bg { position: fixed; inset: 0; z-index: 0; }
        .grid-overlay {
            position: absolute; inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle at 50% 50%, black, transparent 80%);
        }
        .glow { position: absolute; border-radius: 50%; filter: blur(120px); pointer-events: none; }
        .glow-1 { width: 600px; height: 600px; background: rgba(86, 116, 255, 0.1); top: -200px; left: -100px; }
        .glow-2 { width: 400px; height: 400px; background: rgba(168, 85, 247, 0.08); bottom: -100px; right: 10%; }

        .top-controls {
            position: absolute;
            top: 2rem;
            right: 2rem;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .lang-switcher {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .lang-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--mono);
        }

        .lang-btn.active {
            background: var(--accent);
            color: white;
        }

        .theme-toggle {
            cursor: pointer;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            color: var(--text);
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            position: relative;
            top: auto;
            right: auto;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            background: rgba(86, 116, 255, 0.1);
        }
        
        .theme-toggle svg { width: 18px; height: 18px; }
        
        .sun-icon { display: none; }
        [data-theme="light"] .sun-icon { display: block; }
        [data-theme="light"] .moon-icon { display: none; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 4rem 3rem;
            width: min(440px, 92vw);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(20px);
            box-shadow: 0 40px 100px rgba(0,0,0,0.4), 0 0 80px rgba(86, 116, 255, 0.1);
            transform: translateY(0);
            transition: var(--transition);
            text-align: center;
        }
        .card:hover { transform: translateY(-5px); border-color: rgba(86, 116, 255, 0.3); }

        .logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 2.5rem; text-decoration: none; }
        .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            box-shadow: 0 8px 20px rgba(86, 116, 255, 0.3);
        }
        .logo-text { font-size: 1.6rem; font-weight: 800; color: var(--white); letter-spacing: -0.04em; }
        .logo-text span { color: var(--accent); }

        h2 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 0.5rem; color: var(--white); }
        .subtitle { font-size: 0.95rem; color: var(--muted); margin-bottom: 2.5rem; line-height: 1.6; }

        .form-group { margin-bottom: 1.5rem; text-align: left; }
        label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.6rem; }
        input {
            width: 100%; padding: 1rem 1.25rem;
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border);
            border-radius: 12px; color: var(--text);
            font-family: var(--sans); font-size: 1rem;
            outline: none; transition: var(--transition);
        }
        input:focus { border-color: var(--accent); background: rgba(86, 116, 255, 0.05); box-shadow: 0 0 0 4px rgba(86, 116, 255, 0.1); }
        input::placeholder { color: rgba(148, 163, 184, 0.4); }

        .btn {
            width: 100%; padding: 1rem;
            background: var(--accent); color: white;
            border: none; border-radius: 14px;
            font-family: var(--sans); font-size: 1rem;
            font-weight: 700; cursor: pointer; margin-top: 1rem;
            transition: var(--transition);
            box-shadow: 0 12px 32px rgba(86, 116, 255, 0.3);
        }
        .btn:hover { background: #4663f0; transform: translateY(-2px); box-shadow: 0 16px 40px rgba(86, 116, 255, 0.5); }
        .btn:active { transform: translateY(0); }

        .alert { padding: 1rem; border-radius: 12px; font-size: 0.9rem; margin-bottom: 2rem; text-align: left; }
        .alert-error { background: rgba(239, 68, 68, 0.1); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body data-lang="ca">
    <div class="hero-bg">
        <div class="grid-overlay"></div>
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>

    <div class="top-controls">
        <div class="lang-switcher">
            <button class="lang-btn" data-switch-lang="ca">CA</button>
            <button class="lang-btn" data-switch-lang="es">ES</button>
            <button class="lang-btn active" data-switch-lang="en">EN</button>
        </div>
        <button onclick="toggleTheme()" class="theme-toggle" title="Toggle Light/Dark Mode">
            <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
    </div>

    <div class="card">
        <a href="/" class="logo">
            <div class="logo-icon">⚡</div>
            <div class="logo-text">Deploy<span>One</span></div>
        </a>
        <h2 data-i18n="new_title">Set New Password</h2>
        <p class="subtitle" data-i18n="new_desc">Please enter your new password below.</p>
        
        {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
        
        <form method="POST">
            <div class="form-group">
                <label data-i18n="new_pass">New Password</label>
                <input type="password" name="password" required autofocus>
            </div>
            <div class="form-group">
                <label data-i18n="new_confirm">Confirm Password</label>
                <input type="password" name="confirm_password" required>
            </div>
            <button type="submit" class="btn" data-i18n="new_btn">Update Password</button>
        </form>
    </div>

    <script>
        const translations = {
            ca: { new_title: "Nova contrasenya", new_desc: "Introdueix la teva nova contrasenya a continuació.", new_pass: "Nova contrasenya", new_confirm: "Confirmar contrasenya", new_btn: "Actualitzar contrasenya" },
            es: { new_title: "Nueva contraseña", new_desc: "Introduce tu nueva contraseña a continuación.", new_pass: "Nueva contraseña", new_confirm: "Confirmar contraseña", new_btn: "Actualizar contraseña" },
            en: { new_title: "Set New Password", new_desc: "Please enter your new password below.", new_pass: "New Password", new_confirm: "Confirm Password", new_btn: "Update Password" }
        };

        function setLanguage(lang) {
            document.body.setAttribute('data-lang', lang);
            localStorage.setItem('preferred-lang', lang);
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.innerHTML = translations[lang][key];
                }
            });
            document.querySelectorAll('[data-switch-lang]').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-switch-lang') === lang);
            });
        }

        const savedLang = localStorage.getItem('preferred-lang') || 'ca';
        setLanguage(savedLang);

        document.querySelectorAll('[data-switch-lang]').forEach(btn => {
            btn.addEventListener('click', () => {
                setLanguage(btn.getAttribute('data-switch-lang'));
            });
        });

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', currentTheme);
            localStorage.setItem('theme', currentTheme);
        }
    </script>
</body>
</html>
