<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password — DeployOne</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&swap" rel="stylesheet">
    <style>
        :root { --accent:#5674ff; --bg:#03050a; --surface:rgba(255, 255, 255, 0.05); --border:rgba(255, 255, 255, 0.1); --text:#f1f5f9; --muted:#94a3b8; }
        [data-theme="light"] { --bg:#f8fafc; --surface:rgba(0, 0, 0, 0.03); --border:rgba(0, 0, 0, 0.08); --text:#0f172a; --muted:#64748b; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family:'Outfit', sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; transition:0.3s; }
        .card { background:var(--surface); border:1px solid var(--border); border-radius:32px; padding:3rem; width:min(440px, 100%); backdrop-filter:blur(20px); text-align:center; box-shadow:0 40px 100px rgba(0,0,0,0.3); }
        .logo { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:2rem; text-decoration:none; }
        .logo img { width:32px; height:32px; }
        .logo-text { font-size:1.6rem; font-weight:800; color:var(--text); }
        .logo-text span { color:var(--accent); }
        h2 { font-size:1.8rem; font-weight:800; margin-bottom:1rem; }
        p { color:var(--muted); font-size:0.95rem; line-height:1.6; margin-bottom:2rem; }
        .form-group { margin-bottom:1.5rem; text-align:left; }
        label { display:block; font-size:0.75rem; font-weight:700; color:var(--muted); text-transform:uppercase; margin-bottom:0.6rem; }
        input { width:100%; padding:1rem 1.25rem; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:12px; color:var(--text); font-size:1rem; outline:none; transition:0.2s; }
        input:focus { border-color:var(--accent); background:rgba(86,116,255,0.05); }
        .btn { width:100%; padding:1rem; background:var(--accent); color:white; border:none; border-radius:14px; font-weight:700; cursor:pointer; margin-top:1rem; transition:0.2s; font-size:1rem; }
        .btn:hover { transform:translateY(-2px); box-shadow:0 12px 32px rgba(86,116,255,0.3); }
        .alert { padding:1rem; border-radius:12px; font-size:0.9rem; margin-bottom:2rem; }
        .alert-error { background:rgba(239,68,68,0.1); color:#fca5a5; border:1px solid rgba(239,68,68,0.2); }
    </style>
</head>
<body>
    <div class="card">
        <a href="/" class="logo">
            <img src="/static/favicon.png" alt="">
            <div class="logo-text">Deploy<span>One</span></div>
        </a>
        <h2 data-i18n="new_title">Set New Password</h2>
        <p data-i18n="new_desc">Please enter your new password below.</p>
        
        {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
        
        <form method="POST">
            <div class="form-group">
                <label data-i18n="new_pass">New Password</label>
                <input type="password" name="password" required autofocus>
            </div>
            <div class="form-group">
                <label data-i18n="new_confirm">Confirm Password</label>
                <input type="password" name="confirm_password" required>
            </div>
            <button type="submit" class="btn" data-i18n="new_btn">Update Password</button>
        </form>
    </div>
    <script>
        const translations = {
            ca: { new_title: "Nova contrasenya", new_desc: "Introdueix la teva nova contrasenya a continuació.", new_pass: "Nova contrasenya", new_confirm: "Confirmar contrasenya", new_btn: "Actualitzar contrasenya" },
            es: { new_title: "Nueva contraseña", new_desc: "Introduce tu nueva contraseña a continuación.", new_pass: "Nueva contraseña", new_confirm: "Confirmar contraseña", new_btn: "Actualizar contraseña" },
            en: { new_title: "Set New Password", new_desc: "Please enter your new password below.", new_pass: "New Password", new_confirm: "Confirm Password", new_btn: "Update Password" }
        };
        const lang = localStorage.getItem('preferred-lang') || 'ca';
        document.querySelectorAll('[data-i18n]').forEach(e=>{const k=e.getAttribute('data-i18n'); if(translations[lang][k]) e.innerHTML=translations[lang][k];});
    </script>
</body>
</html>
