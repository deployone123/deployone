- name: Create LXC container on Proxmox
  hosts: localhost
  gather_facts: false
  vars:
    proxmox_host: "10.1.100.100"
    proxmox_user: "root@pam"
    proxmox_token_name: "ansible"
    hostname: "web-server"
    node: "deployone"
    template: "local:vztmpl/debian-13-standard_13.1-2_amd64.tar.zst"
    storage: "local-lvm"

  tasks:
    - name: Load secrets file
      include_vars:
        file: vars/secrets.yml

    - name: Get next available VMID via shell (highest >= 1000 + 1)
      shell: |
        MAX_ID=$(pvesh get /cluster/resources --type vm --output-format yaml | grep "vmid:" | grep -oE "[0-9]+" | grep -E "^[1-9][0-9]{3,}$" | sort -n | tail -n 1)
        echo $(( ${MAX_ID:-1000} + 1 ))
      register: next_vmid_shell
      delegate_to: "{{ proxmox_host }}"

    - name: Set vmid fact
      set_fact:
        vmid: "{{ next_vmid_shell.stdout | trim }}"

    - name: Create Debian 13 LXC
      community.proxmox.proxmox:
        vmid: "{{ vmid }}"
        node: "{{ node }}"
        api_host: "{{ proxmox_host }}"
        api_user: "{{ proxmox_user }}"
        api_token_id: "{{ proxmox_token_name }}"
        api_token_secret: "{{ proxmox_token_secret }}"
        validate_certs: false
        ostemplate: "{{ template }}"
        hostname: "{{ hostname }}"
        password: "{{ lxc_password }}"
        storage: "{{ storage }}"
        unprivileged: true
        netif:
          net0: "name=eth0,bridge=vmbr0,ip=dhcp"
        state: present

    - name: Wait for container to start
      community.proxmox.proxmox:
        vmid: "{{ vmid }}"
        node: "{{ node }}"
        api_host: "{{ proxmox_host }}"
        api_user: "{{ proxmox_user }}"
        api_token_id: "{{ proxmox_token_name }}"
        api_token_secret: "{{ proxmox_token_secret }}"
        validate_certs: false
        hostname: "{{ hostname }}"
        state: started

    - name: Get LXC IP address
      shell: "pvesh get /nodes/{{ node }}/lxc/{{ vmid }}/interfaces --output-format json"
      register: lxc_interfaces
      retries: 20
      delay: 5
      until: "lxc_interfaces.stdout | from_json | selectattr('name', 'equalto', 'eth0') | map(attribute='inet') | list | length > 0"
      delegate_to: "{{ proxmox_host }}"

    - name: Enable Root Login via SSH
      shell: |
        pct exec {{ vmid }} -- sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
        pct exec {{ vmid }} -- systemctl restart ssh
      delegate_to: "{{ proxmox_host }}"

    - name: Add new LXC to inventory
      add_host:
        name: "{{ (lxc_interfaces.stdout | from_json | selectattr('name', 'equalto', 'eth0') | first).inet.split('/')[0] }}"
        groups: web_containers
        ansible_user: root
        ansible_ssh_pass: "{{ lxc_password }}"

- name: Install Nginx inside the LXC
  hosts: web_containers
  gather_facts: false

  tasks:
    - name: Wait for SSH to be available
      wait_for_connection:
        timeout: 300

    - name: Installing nginx
      package:
        name: nginx
        state: present
        update_cache: true

    - name: Ensure it's started and enabled
      service:
        name: nginx
        state: started
        enabled: true

    - name: Find any html file not meant to be there
      find:
        paths: /var/www/html
        patterns: "index*.html"
        file_type: file
      register: index_files

    - name: Delete default nginx html
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ index_files.files }}"

    - name: Send html file
      template:
        src: ./index.html
        dest: /var/www/html/index.html
